<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBoard UA ISO</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <link rel="stylesheet" href="practical4.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="keyboard-frame">
        
        <div class="section-main">
            <div class="key esc accent">ESC</div>
            <div class="gap-1u"></div>
            <div class="key">F1</div>
            <div class="key">F2</div>
            <div class="key">F3</div>
            <div class="key">F4</div>
            <div class="gap-05u"></div>
            <div class="key">F5</div>
            <div class="key">F6</div>
            <div class="key">F7</div>
            <div class="key">F8</div>
            <div class="gap-05u"></div>
            <div class="key">F9</div>
            <div class="key">F10</div>
            <div class="key">F11</div>
            <div class="key">F12</div>

            <div class="key">`</div>
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key">0</div>
            <div class="key">-</div>
            <div class="key">=</div>
            <div class="key backspace">BACK</div>

            <div class="key tab">TAB</div>
            <div class="key">Й</div>
            <div class="key">Ц</div>
            <div class="key">У</div>
            <div class="key">K</div>
            <div class="key">Е</div>
            <div class="key">Н</div>
            <div class="key">Г</div>
            <div class="key">Ш</div>
            <div class="key">Щ</div>
            <div class="key">З</div>
            <div class="key">Х</div>
            <div class="key">Ї</div>
            <div class="key enter-iso accent">ENTER</div>

            <div class="key caps">CAPS</div>
            <div class="key">Ф</div>
            <div class="key">І</div>
            <div class="key">В</div>
            <div class="key">А</div>
            <div class="key">П</div>
            <div class="key">Р</div>
            <div class="key">О</div>
            <div class="key">Л</div>
            <div class="key">Д</div>
            <div class="key">Ж</div>
            <div class="key">Є</div>
            <div class="key">\</div>

            <div class="key shift-l-iso">SHIFT</div>
            <div class="key">Ґ</div> 
            <div class="key">Я</div>
            <div class="key">Ч</div>
            <div class="key">С</div>
            <div class="key">М</div>
            <div class="key">И</div>
            <div class="key">Т</div>
            <div class="key">Ь</div>
            <div class="key">Б</div>
            <div class="key">Ю</div>
            <div class="key">.</div>
            <div class="key shift-r-iso">SHIFT</div>

            <div class="key mod">CTRL</div>
            <div class="key mod">WIN</div>
            <div class="key mod">ALT</div>
            <div class="key space"></div>
            <div class="key mod">ALT</div>
            <div class="key mod">FN</div>
            <div class="key mod">MENU</div>
            <div class="key mod">CTRL</div>
        </div>

        <div class="section-nav">
            <div class="key">PRT</div>
            <div class="key">SCR</div>
            <div class="key">PAU</div>
            
            <div class="nav-gap-row"></div>

            <div class="key">INS</div>
            <div class="key">HOM</div>
            <div class="key">PGU</div>
            <div class="key">DEL</div>
            <div class="key">END</div>
            <div class="key">PGD</div>

            <div class="nav-gap-row-large"></div>

            <div class="hidden-key"></div>
            <div class="key">↑</div>
            <div class="hidden-key"></div>
            <div class="key">←</div>
            <div class="key">↓</div>
            <div class="key">→</div>
        </div>

        <div class="section-numpad">
            <div class="key">NUM</div>
            <div class="key">/</div>
            <div class="key">*</div>
            <div class="key">-</div>

            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key num-plus">+</div>

            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>

            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key num-enter accent">ENT</div>

            <div class="key num-0">0</div>
            <div class="key">.</div>
        </div>

    </div>

    <div class="back-container">
        <a href="../practicals.html" class="back-btn">← Назад</a>
    </div>

    <script src="practical4.js"></script>

</html>
