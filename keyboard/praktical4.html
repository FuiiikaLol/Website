<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Work #4 - Keyboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e8e8e8;
            --case-color: #bdc3c7;
            --key-color: #fdfdfd;
            --key-text: #333;
            --shadow-light: #fff;
            --shadow-dark: #8e9eab;
        }

        body {
            background-color: #fff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Корпус клавіатури */
        .keyboard {
            background: linear-gradient(to bottom, #d7d7d7, #b0b0b0);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 
                0 15px 30px rgba(0,0,0,0.3),
                inset 0 2px 5px rgba(255,255,255,0.5);
            display: flex;
            gap: 20px;
            border: 1px solid #999;
            max-width: 1200px;
        }

        /* --- ЗАГАЛЬНІ СТИЛІ ДЛЯ КНОПОК --- */
        .key {
            background-color: var(--key-color);
            border: none;
            border-radius: 6px;
            color: var(--key-text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            /* Вимога 3: Тіні для стилізації */
            box-shadow: 
                0 4px 0 #888, 
                0 5px 5px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Вимога 4: Кнопки змінюють стиль (стан active) */
        .key:active {
            box-shadow: 
                0 0 0 #888, 
                inset 0 2px 3px rgba(0,0,0,0.2);
            transform: translateY(4px);
        }

        /* --- СЕКЦІЯ 1: ГОЛОВНА (БУКВИ) --- */
        /* Вимога 1: Розмітка за допомогою Grid */
        .section-main {
            display: grid;
            /* 15 колонок для основного блоку - стандарт */
            grid-template-columns: repeat(30, 30px); 
            grid-template-rows: repeat(6, 45px);
            gap: 6px;
        }

        /* Спеціальні розміри кнопок в Main Section */
        .k-span-2 { grid-column: span 2; } /* Стандартна клавіша 1u = 2 клітинки грід */
        .k-span-3 { grid-column: span 3; } /* ~1.5u */
        .k-span-4 { grid-column: span 4; } /* ~2u */
        .k-span-5 { grid-column: span 5; }
        .k-space { grid-column: span 13; } /* Пробіл */
        
        /* Функціональний ряд (F1-F12) */
        .f-row-gap { margin-right: 15px; } /* Відступи між групами F-клавіш */

        /* --- СЕКЦІЯ 2: НАВІГАЦІЯ (СТРІЛКИ) --- */
        .section-nav {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100px;
        }

        .nav-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 45px);
            gap: 6px;
        }

        .nav-arrows {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 45px);
            gap: 6px;
            margin-top: auto; /* Притиснути до низу */
        }

        /* --- СЕКЦІЯ 3: ЦИФРОВИЙ БЛОК (NUMPAD) --- */
        .section-numpad {
            display: grid;
            grid-template-columns: repeat(4, 45px); /* 4 колонки */
            grid-template-rows: 45px repeat(5, 45px); /* Header + 5 рядів */
            gap: 6px;
        }

        .num-0 { grid-column: span 2; }
        .num-plus { grid-row: span 2; height: 100%; }
        .num-enter { grid-row: span 2; height: 100%; background-color: #ddeeff; }

        /* Кольори для спец клавіш */
        .grey-key { background-color: #eee; font-size: 12px; }
        .esc-key { background-color: #ffcccc; }

        /* Підписи на клавішах (верхній/нижній символ) */
        .key span { display: block; line-height: 1; }
        .top-char { font-size: 10px; margin-bottom: 2px; }

    </style>
</head>
<body>

    <div class="keyboard">
        
        <div class="section-main">
            <button class="key k-span-2 esc-key">Esc</button>
            <div style="grid-column: span 2;"></div> <button class="key k-span-2 grey-key">F1</button>
            <button class="key k-span-2 grey-key">F2</button>
            <button class="key k-span-2 grey-key">F3</button>
            <button class="key k-span-2 grey-key f-row-gap">F4</button>
            <button class="key k-span-2 grey-key">F5</button>
            <button class="key k-span-2 grey-key">F6</button>
            <button class="key k-span-2 grey-key">F7</button>
            <button class="key k-span-2 grey-key f-row-gap">F8</button>
            <button class="key k-span-2 grey-key">F9</button>
            <button class="key k-span-2 grey-key">F10</button>
            <button class="key k-span-2 grey-key">F11</button>
            <button class="key k-span-2 grey-key">F12</button>

            <button class="key k-span-2">` ~</button>
            <button class="key k-span-2">1 !</button>
            <button class="key k-span-2">2 @</button>
            <button class="key k-span-2">3 #</button>
            <button class="key k-span-2">4 $</button>
            <button class="key k-span-2">5 %</button>
            <button class="key k-span-2">6 ^</button>
            <button class="key k-span-2">7 &</button>
            <button class="key k-span-2">8 *</button>
            <button class="key k-span-2">9 (</button>
            <button class="key k-span-2">0 )</button>
            <button class="key k-span-2">- _</button>
            <button class="key k-span-2">= +</button>
            <button class="key k-span-4 grey-key">Backspace</button>

            <button class="key k-span-3 grey-key">Tab</button>
            <button class="key k-span-2">Q</button>
            <button class="key k-span-2">W</button>
            <button class="key k-span-2">E</button>
            <button class="key k-span-2">R</button>
            <button class="key k-span-2">T</button>
            <button class="key k-span-2">Y</button>
            <button class="key k-span-2">U</button>
            <button class="key k-span-2">I</button>
            <button class="key k-span-2">O</button>
            <button class="key k-span-2">P</button>
            <button class="key k-span-2">[ {</button>
            <button class="key k-span-2">] }</button>
            <button class="key k-span-3 grey-key">\ |</button>

            <button class="key k-span-4 grey-key">Caps Lock</button>
            <button class="key k-span-2">A</button>
            <button class="key k-span-2">S</button>
            <button class="key k-span-2">D</button>
            <button class="key k-span-2">F</button>
            <button class="key k-span-2">G</button>
            <button class="key k-span-2">H</button>
            <button class="key k-span-2">J</button>
            <button class="key k-span-2">K</button>
            <button class="key k-span-2">L</button>
            <button class="key k-span-2">; :</button>
            <button class="key k-span-2">' "</button>
            <button class="key k-span-4 grey-key" style="background:#ddeeff">Enter</button>

            <button class="key k-span-5 grey-key">Shift</button>
            <button class="key k-span-2">Z</button>
            <button class="key k-span-2">X</button>
            <button class="key k-span-2">C</button>
            <button class="key k-span-2">V</button>
            <button class="key k-span-2">B</button>
            <button class="key k-span-2">N</button>
            <button class="key k-span-2">M</button>
            <button class="key k-span-2">, <</button>
            <button class="key k-span-2">. ></button>
            <button class="key k-span-2">/ ?</button>
            <button class="key k-span-5 grey-key">Shift</button>

            <button class="key k-span-3 grey-key">Ctrl</button>
            <button class="key k-span-3 grey-key">Win</button>
            <button class="key k-span-3 grey-key">Alt</button>
            <button class="key k-space"></button>
            <button class="key k-span-3 grey-key">Alt</button>
            <button class="key k-span-3 grey-key">Fn</button>
            <button class="key k-span-3 grey-key">Ctrl</button>
        </div>

        <div class="section-nav">
            <div class="nav-top">
                <button class="key grey-key">PrtSc</button>
                <button class="key grey-key">ScrlLk</button>
                <button class="key grey-key">Pause</button>
                
                <button class="key grey-key">Ins</button>
                <button class="key grey-key">Home</button>
                <button class="key grey-key">PgUp</button>
                
                <button class="key grey-key">Del</button>
                <button class="key grey-key">End</button>
                <button class="key grey-key">PgDn</button>
            </div>

            <div class="nav-arrows">
                <div></div> <button class="key grey-key">↑</button>
                <div></div> <button class="key grey-key">←</button>
                <button class="key grey-key">↓</button>
                <button class="key grey-key">→</button>
            </div>
        </div>

        <div class="section-numpad">
            <div style="grid-column: span 4; height: 45px;"></div>

            <button class="key grey-key">Num</button>
            <button class="key grey-key">/</button>
            <button class="key grey-key">*</button>
            <button class="key grey-key">-</button>

            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key grey-key num-plus">+</button>

            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key grey-key num-enter">Enter</button>

            <button class="key num-0">0</button>
            <button class="key">.</button>
        </div>

    </div>

</body>
</html>
