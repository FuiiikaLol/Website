<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна №6: Sprite Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Press Start 2P', cursive;
            height: 100vh;
            user-select: none;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

     
        .sky {
            position: absolute; top: 0; width: 100%; height: 60%;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); z-index: 1;
        }

        .sun {
            position: absolute; top: 50px; right: 50px; width: 80px; height: 80px;
            background: #FFD700; border-radius: 50%; box-shadow: 0 0 40px #FFD700;
            animation: sunPulse 4s infinite alternate; z-index: 2;
        }
        @keyframes sunPulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .cloud {
            position: absolute; background: #fff; border-radius: 50px; z-index: 2; opacity: 0.8;
            animation: moveClouds linear infinite;
        }
        .cloud::after, .cloud::before { content: ''; position: absolute; background: inherit; border-radius: 50%; }
        .c1 { width: 120px; height: 40px; top: 100px; left: -150px; animation-duration: 25s; }
        .c1::after { width: 50px; height: 50px; top: -25px; left: 15px; }
        .c1::before { width: 40px; height: 40px; top: -15px; left: 50px; }
        .c2 { width: 100px; height: 35px; top: 50px; left: -120px; animation-duration: 18s; animation-delay: 5s; }
        .c2::after { width: 40px; height: 40px; top: -20px; left: 10px; }
        @keyframes moveClouds { from { left: -150px; } to { left: 110%; } }

        .ground {
            position: absolute; bottom: 0; width: 100%; height: 40%;
            background: #4caf50; border-top: 10px solid #45a049; z-index: 3;
            background-image: linear-gradient(45deg, #55b759 25%, transparent 25%, transparent 75%, #55b759 75%, #55b759), linear-gradient(45deg, #55b759 25%, transparent 25%, transparent 75%, #55b759 75%, #55b759);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            animation: moveGround 0.5s linear infinite;
        }
        @keyframes moveGround { from { background-position: 0 0, 20px 20px; } to { background-position: -40px 0, -20px 20px; } }

     
        .character-container {
            position: absolute;
            bottom: 30%;
            left: 50%;
            z-index: 4;
            display: flex; flex-direction: column; align-items: center;
            transition: left 0.1s linear; 
        }

        .pikachu {
            width: 120px; height: 120px;
            background-image: url('Running-Pikachu-GIF.webp');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            
           
            animation: bounce 0.6s ease-in-out infinite alternate;
        }

       
        .flipped {
            transform: scaleX(-1);
        }

        
        .rotating {
            animation: spin 0.8s linear !important; 
        }

        .shadow {
            width: 80px; height: 20px; background: rgba(0,0,0,0.2);
            border-radius: 50%; margin-top: -15px;
            animation: shadowPulse 0.6s ease-in-out infinite alternate;
        }

       
        
    
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px); } 
        }

        
        @keyframes spin {
            0% { transform: translateY(-50px) rotate(0deg); }
            50% { transform: translateY(-150px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        @keyframes shadowPulse { from { transform: scale(1); opacity: 0.3; } to { transform: scale(0.8); opacity: 0.1; } }

        .title {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; text-shadow: 2px 2px 0 #000; z-index: 5; font-size: 24px;
        }
        .controls-hint {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            color: white; font-size: 14px; z-index: 5; opacity: 0.9; text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="ground"></div>

        <div class="character-container" id="player">
            <div class="pikachu" id="pikachu-sprite"></div>
            <div class="shadow"></div>
        </div>

        <div class="title">LAB 6: POKEMON RUN</div>
        <div class="controls-hint">⬅️ Біг ➡️ | Пробіл - САЛЬТО</div>
    </div>

    <script>
        const player = document.getElementById('player');
        const sprite = document.getElementById('pikachu-sprite');
        
        let positionX = 50; 
        const speed = 2; 

        document.addEventListener('keydown', (event) => {
            
            if (event.key === 'ArrowLeft') {
                positionX -= speed;
                sprite.classList.add('flipped'); 
            } else if (event.key === 'ArrowRight') {
                positionX += speed;
                sprite.classList.remove('flipped');
            }

          
            if (event.code === 'Space') {
               
                if (!sprite.classList.contains('rotating')) {
                    sprite.classList.add('rotating');
                    
                   
                    setTimeout(() => {
                        sprite.classList.remove('rotating');
                    }, 800);
                }
            }

          
            if (positionX < -10) positionX = 110;
            if (positionX > 110) positionX = -10;

            player.style.left = positionX + '%';
        });
    </script>

</body>
</html>
