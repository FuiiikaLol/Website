<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична №3: Макет YouTube (Flexbox)</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <link rel="stylesheet" href="practical3.css?v=4"> 
</head>
<body>

    <header class="header-flex">
        <div class="logo">YouTube Clone</div>
        <div class="search-bar">Пошук...</div>
        <div class="user-controls">👤 🔔 ⋮</div>
    </header>

    <div class="main-layout">
        
        <nav class="sidebar">
            <a href="#">Головна</a>
            <a href="#">Шорти</a>
            <a href="#">Підписки</a>
            <hr>
            <a href="#">Бібліотека</a>
            <a href="#">Історія</a>
        </nav>

        <main class="video-grid-container">
            
            <div class="video-item">
                <div class="thumbnail-container">
                    <img src="https://picsum.photos/id/10/320/180" alt="Відео 1">
                    <span class="video-time">12:34</span>
                </div>
                <p class="video-title">Назва відео 1</p>
            </div>
            
            <div class="video-item">
                <div class="thumbnail-container">
                    <img src="https://picsum.photos/id/20/320/180" alt="Відео 2">
                    <span class="video-time">05:18</span>
                </div>
                <p class="video-title">Назва відео 2</p>
            </div>
            
            <div class="video-item">
                <div class="thumbnail-container">
                    <img src="https://picsum.photos/id/30/320/180" alt="Відео 3">
                    <span class="video-time">25:00</span>
                </div>
                <p class="video-title">Назва відео 3</p>
            </div>
            
            <div class="video-item">
                <div class="thumbnail-container">
                    <img src="https://picsum.photos/id/40/320/180" alt="Відео 4">
                    <span class="video-time">08:45</span>
                </div>
                <p class="video-title">Назва відео 4</p>
            </div>
            
            <div class="video-item">
                <div class="thumbnail-container">
                    <img src="https://picsum.photos/id/50/320/180" alt="Відео 5">
                    <span class="video-time">17:10</span>
                </div>
                <p class="video-title">Назва відео 5</p>
            </div>
            
            <div class="video-item">
                <div class="thumbnail-container">
                    <img src="https://picsum.photos/id/60/320/180" alt="Відео 6">
                    <span class="video-time">03:59</span>
                </div>
                <p class="video-title">Назва відео 6</p>
            </div>
            
        </main>
    </div>

</body>
</html>
