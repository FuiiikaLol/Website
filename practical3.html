<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична №3: Макет YouTube (Flexbox)</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <link rel="stylesheet" href="practical3.css"> 
</head>
<body>

    <header class="header-flex">
        <div class="logo">YouTube Clone</div>
        <div class="search-bar">Пошук...</div>
        <div class="user-controls">👤 🔔 ⋮</div>
    </header>

    <div class="main-layout">
        
        <nav class="sidebar">
            <a href="#">Головна</a>
            <a href="#">Шорти</a>
            <a href="#">Підписки</a>
            <hr>
            <a href="#">Бібліотека</a>
            <a href="#">Історія</a>
        </nav>

        <main class="video-grid-container">
            <div class="video-item">
                <img src="https://via.placeholder.com/320x180/0000FF/FFFFFF?text=ВІДЕО+1" alt="Відео 1">
                <p class="video-title">Назва відео 1</p>
            </div>
            <div class="video-item">
                <img src="https://via.placeholder.com/320x180/FF0000/FFFFFF?text=ВІДЕО+2" alt="Відео 2">
                <p class="video-title">Назва відео 2</p>
            </div>
            <div class="video-item">
                <img src="https://via.placeholder.com/320x180/00FF00/FFFFFF?text=ВІДЕО+3" alt="Відео 3">
                <p class="video-title">Назва відео 3</p>
            </div>
            <div class="video-item">
                <img src="https://via.placeholder.com/320x180/FFFF00/000000?text=ВІДЕО+4" alt="Відео 4">
                <p class="video-title">Назва відео 4</p>
            </div>
            <div class="video-item">
                <img src="https://via.placeholder.com/320x180/FF00FF/FFFFFF?text=ВІДЕО+5" alt="Відео 5">
                <p class="video-title">Назва відео 5</p>
            </div>
            <div class="video-item">
                <img src="https://via.placeholder.com/320x180/00FFFF/000000?text=ВІДЕО+6" alt="Відео 6</p>
                <p class="video-title">Назва відео 6</p>
            </div>
        </main>
    </div>

</body>
</html>
