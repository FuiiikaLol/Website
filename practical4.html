<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Виртуальная клавиатура</title>
  <link rel="stylesheet" href="keyboard.css" />
</head>
<body>
  <main class="keyboard-wrap">
    <section class="keyboard">
      <div class="row row-fn">
        <div class="key small">Esc</div>
        <div class="spacer"></div>
        <div class="key small">F1</div>
        <div class="key small">F2</div>
        <div class="key small">F3</div>
        <div class="key small">F4</div>
        <div class="spacer"></div>
        <div class="key small">F5</div>
        <div class="key small">F6</div>
        <div class="key small">F7</div>
        <div class="key small">F8</div>
        <div class="spacer"></div>
        <div class="key small">F9</div>
        <div class="key small">F10</div>
        <div class="key small">F11</div>
        <div class="key small">F12</div>
      </div>

      <div class="row">
        <div class="key code">`<span class="ru">ё</span></div>
        <div class="key code">1<span class="ru">!</span></div>
        <div class="key code">2<span class="ru">@</span></div>
        <div class="key code">3<span class="ru">№</span></div>
        <div class="key code">4<span class="ru">;</span></div>
        <div class="key code">5<span class="ru">%</span></div>
        <div class="key code">6<span class="ru">:</span></div>
        <div class="key code">7<span class="ru">?</span></div>
        <div class="key code">8<span class="ru">*</span></div>
        <div class="key code">9<span class="ru">(</span></div>
        <div class="key code">0<span class="ru">)</span></div>
        <div class="key code">-<span class="ru">_</span></div>
        <div class="key code">=<span class="ru">+</span></div>
        <div class="key wide">Backspace</div>
      </div>

      <div class="row">
        <div class="key wide">Tab</div>
        <div class="key">Q<span class="ru">й</span></div>
        <div class="key">W<span class="ru">ц</span></div>
        <div class="key">E<span class="ru">у</span></div>
        <div class="key">R<span class="ru">к</span></div>
        <div class="key">T<span class="ru">е</span></div>
        <div class="key">Y<span class="ru">н</span></div>
        <div class="key">U<span class="ru">г</span></div>
        <div class="key">I<span class="ru">ш</span></div>
        <div class="key">O<span class="ru">щ</span></div>
        <div class="key">P<span class="ru">з</span></div>
        <div class="key">[<span class="ru">х</span></div>
        <div class="key">]<span class="ru">ъ</span></div>
        <div class="key wide">|\</div>
      </div>

      <div class="row">
        <div class="key wide">Caps</div>
        <div class="key">A<span class="ru">ф</span></div>
        <div class="key">S<span class="ru">ы</span></div>
        <div class="key">D<span class="ru">в</span></div>
        <div class="key">F<span class="ru">а</span></div>
        <div class="key">G<span class="ru">п</span></div>
        <div class="key">H<span class="ru">р</span></div>
        <div class="key">J<span class="ru">о</span></div>
        <div class="key">K<span class="ru">л</span></div>
        <div class="key">L<span class="ru">д</span></div>
        <div class="key">;<span class="ru">ж</span></div>
        <div class="key">'<span class="ru">э</span></div>
        <div class="key wide">Enter</div>
      </div>

      <div class="row">
        <div class="key extra-wide">Shift</div>
        <div class="key">Z<span class="ru">я</span></div>
        <div class="key">X<span class="ru">ч</span></div>
        <div class="key">C<span class="ru">с</span></div>
        <div class="key">V<span class="ru">м</span></div>
        <div class="key">B<span class="ru">и</span></div>
        <div class="key">N<span class="ru">т</span></div>
        <div class="key">M<span class="ru">ь</span></div>
        <div class="key">,<span class="ru">б</span></div>
        <div class="key">.<span class="ru">ю</span></div>
        <div class="key">/<span class="ru">.</span></div>
        <div class="key extra-wide">Shift</div>
      </div>

      <div class="row bottom">
        <div class="key wide">Ctrl</div>
        <div class="key wide">Win</div>
        <div class="key wide">Alt</div>
        <div class="key space">Space</div>
        <div class="key wide">Alt</div>
        <div class="key wide">Fn</div>
        <div class="key wide">Ctrl</div>
        <div class="nav">
          <div class="key small">↑</div>
          <div class="key small">←</div>
          <div class="key small">↓</div>
          <div class="key small">→</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
