<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Виртуальная клавиатура</title>
  <link rel="stylesheet" href="keyboard.css" />
</head>
<body>
  <main class="keyboard-wrap">
    <section class="keyboard">
      <!-- Row: Function keys -->
      <div class="row row-fn">
        <div class="key small">Esc</div>
        <div class="spacer"></div>
        <div class="key small">F1</div>
        <div class="key small">F2</div>
        <div class="key small">F3</div>
        <div class="key small">F4</div>
        <div class="spacer"></div>
        <div class="key small">F5</div>
        <div class="key small">F6</div>
        <div class="key small">F7</div>
        <div class="key small">F8</div>
        <div class="spacer"></div>
        <div class="key small">F9</div>
        <div class="key small">F10</div>
        <div class="key small">F11</div>
        <div class="key small">F12</div>
      </div>

      <!-- Row: Number row -->
      <div class="row">
        <div class="key code" data-ru="ё">`<span class="ru">ё</span></div>
        <div class="key code" data-ru="1">1<span class="ru">!</span></div>
        <div class="key code" data-ru="2">2<span class="ru">@</span></div>
        <div class="key code" data-ru="3">3<span class="ru">№</span></div>
        <div class="key code" data-ru="4">4<span class="ru">;</span></div>
        <div class="key code" data-ru="5">5<span class="ru">%</span></div>
        <div class="key code" data-ru="6">6<span class="ru">:</span></div>
        <div class="key code" data-ru="7">7<span class="ru">?</span></div>
        <div class="key code" data-ru="8">8<span class="ru">*</span></div>
        <div class="key code" data-ru="9">9<span class="ru">(</span></div>
        <div class="key code" data-ru="0">0<span class="ru">)</span></div>
        <div class="key code" data-ru="-">-<span class="ru">_</span></div>
        <div class="key code" data-ru="=">=<span class="ru">+</span></div>
        <div class="key wide">Backspace</div>
      </div>

      <!-- Row: QWERTY / ЙЦУКЕН -->
      <div class="row">
        <div class="key wide">Tab</div>
        <div class="key" data-en="q" data-ru="й">Q<span class="ru">й</span></div>
        <div class="key" data-en="w" data-ru="ц">W<span class="ru">ц</span></div>
        <div class="key" data-en="e" data-ru="у">E<span class="ru">у</span></div>
        <div class="key" data-en="r" data-ru="к">R<span class="ru">к</span></div>
        <div class="key" data-en="t" data-ru="е">T<span class="ru">е</span></div>
        <div class="key" data-en="y" data-ru="н">Y<span class="ru">н</span></div>
        <div class="key" data-en="u" data-ru="г">U<span class="ru">г</span></div>
        <div class="key" data-en="i" data-ru="ш">I<span class="ru">ш</span></div>
        <div class="key" data-en="o" data-ru="щ">O<span class="ru">щ</span></div>
        <div class="key" data-en="p" data-ru="з">P<span class="ru">з</span></div>
        <div class="key" data-en="[" data-ru="х">[<span class="ru">х</span></div>
        <div class="key" data-en="]" data-ru="ъ">]<span class="ru">ъ</span></div>
        <div class="key wide">|\</div>
      </div>

      <!-- Row: ASDF / ФЫВАП -->
      <div class="row">
        <div class="key wide">Caps</div>
        <div class="key" data-en="a" data-ru="ф">A<span class="ru">ф</span></div>
        <div class="key" data-en="s" data-ru="ы">S<span class="ru">ы</span></div>
        <div class="key" data-en="d" data-ru="в">D<span class="ru">в</span></div>
        <div class="key" data-en="f" data-ru="а">F<span class="ru">а</span></div>
        <div class="key" data-en="g" data-ru="п">G<span class="ru">п</span></div>
        <div class="key" data-en="h" data-ru="р">H<span class="ru">р</span></div>
        <div class="key" data-en="j" data-ru="о">J<span class="ru">о</span></div>
        <div class="key" data-en="k" data-ru="л">K<span class="ru">л</span></div>
        <div class="key" data-en="l" data-ru="д">L<span class="ru">д</span></div>
        <div class="key" data-en=";" data-ru="ж">;<span class="ru">ж</span></div>
        <div class="key" data-en="'" data-ru="э">'<span class="ru">э</span></div>
        <div class="key wide">Enter</div>
      </div>

      <!-- Row: ZXCV / ЯЧСМИ -->
      <div class="row">
        <div class="key extra-wide">Shift</div>
        <div class="key" data-en="z" data-ru="я">Z<span class="ru">я</span></div>
        <div class="key" data-en="x" data-ru="ч">X<span class="ru">ч</span></div>
        <div class="key" data-en="c" data-ru="с">C<span class="ru">с</span></div>
        <div class="key" data-en="v" data-ru="м">V<span class="ru">м</span></div>
        <div class="key" data-en="b" data-ru="и">B<span class="ru">и</span></div>
        <div class="key" data-en="n" data-ru="т">N<span class="ru">т</span></div>
        <div class="key" data-en="m" data-ru="ь">M<span class="ru">ь</span></div>
        <div class="key" data-en="," data-ru="б">,<span class="ru">б</span></div>
        <div class="key" data-en="." data-ru="ю">.<span class="ru">ю</span></div>
        <div class="key" data-en="/" data-ru=".">/<span class="ru">.</span></div>
        <div class="key extra-wide">Shift</div>
      </div>

      <!-- Row: Bottom modifiers and arrows -->
      <div class="row bottom">
        <div class="key wide">Ctrl</div>
        <div class="key wide">Win</div>
        <div class="key wide">Alt</div>
        <div class="key space">Space</div>
        <div class="key wide">Alt</div>
        <div class="key wide">Fn</div>
        <div class="key wide">Ctrl</div>
        <div class="nav">
          <div class="key small">↑</div>
          <div class="key small">←</div>
          <div class="key small">↓</div>
          <div class="key small">→</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
